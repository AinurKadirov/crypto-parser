services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-parser-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crypto_parser
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser -d crypto_parser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
